[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dexhand-agent"
version = "0.1.0"
description = "A small Codex-facing runtime for dexterous tool use in local simulation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["mujoco==3.5.0", "numpy==2.2.4", "Pillow==11.1.0"]

[project.optional-dependencies]
video = ["opencv-python==4.13.0.92"]
test = ["pytest>=8"]

[project.scripts]
dexhand-agent = "dexhand_agent.run:main"

[tool.setuptools.packages.find]
include = ["dexhand_agent*"]
